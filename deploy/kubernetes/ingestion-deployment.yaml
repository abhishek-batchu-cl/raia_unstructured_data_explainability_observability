---
apiVersion: v1
kind: ConfigMap
metadata:
  name: raia-ingestion-config
  namespace: raia
data:
  RAIA_STORAGE_BACKEND: "postgres"
  RAIA_POSTGRES_URL: "postgresql://raia:password@postgres:5432/raia"
  RAIA_REQUIRE_API_KEY: "true"
  RAIA_REQUIRE_SIGNATURE: "true"
  RAIA_ENABLE_VALIDATION: "true"
  RAIA_SCHEMA_PATH: "/app/schemas/event_schema.json"

---
apiVersion: v1
kind: Secret
metadata:
  name: raia-ingestion-secrets
  namespace: raia
type: Opaque
stringData:
  RAIA_API_KEYS: "raia_v1_prod_key1,raia_v1_prod_key2"
  RAIA_HMAC_SECRET: "your-hmac-secret-here-change-me"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raia-ingestion
  namespace: raia
  labels:
    app: raia-ingestion
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: raia-ingestion
  template:
    metadata:
      labels:
        app: raia-ingestion
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: raia-ingestion
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ingestion
        image: raia/ingestion:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: raia-ingestion-config
        - secretRef:
            name: raia-ingestion-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: schemas
          mountPath: /app/schemas
          readOnly: true
      volumes:
      - name: schemas
        configMap:
          name: raia-schemas

---
apiVersion: v1
kind: Service
metadata:
  name: raia-ingestion
  namespace: raia
  labels:
    app: raia-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: raia-ingestion

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: raia-ingestion-hpa
  namespace: raia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: raia-ingestion
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: raia_queue_size
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: raia-ingestion-pdb
  namespace: raia
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: raia-ingestion

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raia-ingestion
  namespace: raia

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raia-ingestion
  namespace: raia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/limit-connections: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ingest.raia.example.com
    secretName: raia-ingestion-tls
  rules:
  - host: ingest.raia.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: raia-ingestion
            port:
              number: 80
