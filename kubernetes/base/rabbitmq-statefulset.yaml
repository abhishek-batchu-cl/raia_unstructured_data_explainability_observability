apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raia-rabbitmq
  labels:
    app: raia-rabbitmq
spec:
  serviceName: raia-rabbitmq
  replicas: 3  # Clustered RabbitMQ for HA
  selector:
    matchLabels:
      app: raia-rabbitmq
  template:
    metadata:
      labels:
        app: raia-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: erlang_cookie
            - name: RABBITMQ_NODENAME
              value: rabbit@$(POD_NAME).raia-rabbitmq.$(POD_NAMESPACE).svc.cluster.local
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: raia-rabbitmq
  labels:
    app: raia-rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      name: amqp
    - port: 15672
      name: management
  selector:
    app: raia-rabbitmq

---
apiVersion: v1
kind: Service
metadata:
  name: raia-rabbitmq-headless
  labels:
    app: raia-rabbitmq
spec:
  clusterIP: None
  ports:
    - port: 5672
      name: amqp
    - port: 4369
      name: epmd
    - port: 25672
      name: clustering
  selector:
    app: raia-rabbitmq
