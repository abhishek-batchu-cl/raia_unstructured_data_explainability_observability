# Prometheus Alert Rules for RAIA
# Deploy to Prometheus via ConfigMap or alert manager config

groups:
  - name: raia_reliability
    interval: 1m
    rules:
      - alert: HighTaskFailureRate
        expr: |
          (
            sum(rate(raia_events_stored_total{event_type="finalized", success="false"}[5m])) by (tenant, project, agent_id)
            /
            sum(rate(raia_events_stored_total{event_type="finalized"}[5m])) by (tenant, project, agent_id)
          ) * 100 > 10
        for: 5m
        labels:
          severity: critical
          team: reliability
        annotations:
          summary: "High task failure rate for {{ $labels.agent_id }}"
          description: "Task failure rate is {{ $value | humanizePercentage }} (threshold: 10%) for agent {{ $labels.agent_id }} in {{ $labels.tenant }}/{{ $labels.project }}"
          runbook: "https://docs.raia.ai/runbooks/high-failure-rate"

      - alert: HighEscalationRate
        expr: |
          (
            count(rate(raia_events_stored_total{event_type="escalation"}[10m])) by (tenant, project, agent_id)
            /
            count(rate(raia_events_stored_total{event_type="finalized"}[10m])) by (tenant, project, agent_id)
          ) * 100 > 30
        for: 10m
        labels:
          severity: warning
          team: reliability
        annotations:
          summary: "High escalation rate for {{ $labels.agent_id }}"
          description: "Escalation rate is {{ $value | humanizePercentage }} (threshold: 30%) - agent may be unreliable"

      - alert: SafetyViolationDetected
        expr: |
          increase(raia_events_stored_total{event_type="policy_flag", severity=~"violation|critical"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: safety
          page: "true"
        annotations:
          summary: "Safety violation detected for {{ $labels.agent_id }}"
          description: "{{ $value }} safety violations detected in last 5 minutes for {{ $labels.agent_id }}"
          runbook: "https://docs.raia.ai/runbooks/safety-violation"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(raia_events_stored_total{event_type="error", recoverable="false"}[5m])) by (tenant, project, agent_id)
            /
            sum(rate(raia_events_stored_total{event_type="session_start"}[5m])) by (tenant, project, agent_id)
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          team: reliability
        annotations:
          summary: "High error rate for {{ $labels.agent_id }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

  - name: raia_performance
    interval: 1m
    rules:
      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(raia_ingest_latency_seconds_bucket[5m])) by (le, backend)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: performance
        annotations:
          summary: "High p95 ingestion latency for {{ $labels.backend }}"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"

      - alert: HighTokenUsage
        expr: |
          avg(
            sum(raia_token_usage_total) by (tenant, project, agent_id)
            /
            count(raia_events_stored_total{event_type="finalized", success="true"}) by (tenant, project, agent_id)
          ) > 50000
        for: 10m
        labels:
          severity: warning
          team: cost
        annotations:
          summary: "High token usage for {{ $labels.agent_id }}"
          description: "Average tokens per success is {{ $value }} (threshold: 50k) - check for inefficiency"

  - name: raia_infrastructure
    interval: 30s
    rules:
      - alert: IngestionServiceDown
        expr: up{job="raia-ingestion"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
          page: "true"
        annotations:
          summary: "RAIA ingestion service is down"
          description: "Ingestion service {{ $labels.instance }} has been down for 1 minute"

      - alert: HighEventDropRate
        expr: |
          rate(raia_events_dropped_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High event drop rate"
          description: "Dropping {{ $value }} events/sec - check queue capacity or backpressure"

      - alert: CircuitBreakerOpen
        expr: raia_circuit_breaker_state == 1
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Circuit breaker open for {{ $labels.instance }}"
          description: "Circuit breaker has been open for 2 minutes - downstream system may be failing"

      - alert: HighIngestionBacklog
        expr: raia_queue_size > 5000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High ingestion queue backlog"
          description: "Queue size is {{ $value }} (threshold: 5000) - may need to scale ingestion"

  - name: raia_data_quality
    interval: 5m
    rules:
      - alert: HighSchemaValidationFailures
        expr: |
          rate(raia_events_invalid_total{reason="schema"}[10m]) > 5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High schema validation failure rate"
          description: "{{ $value }} events/sec failing schema validation - check SDK version or schema compatibility"

      - alert: LowObservabilityCoverage
        expr: |
          avg(observability_coverage) by (agent_id) < 80
        for: 15m
        labels:
          severity: warning
          team: reliability
        annotations:
          summary: "Low observability coverage for {{ $labels.agent_id }}"
          description: "Coverage is {{ $value | humanizePercentage }} (threshold: 80%) - agent may be under-instrumented"

  - name: raia_slo_burn_rate
    interval: 1m
    rules:
      # SLO: 99.9% success rate over 28 days (error budget: 0.1%)
      # Fast burn: consuming 5% of monthly budget in 1 hour
      - alert: SuccessRateSLOFastBurn
        expr: |
          (
            1 - (
              sum(rate(raia_events_stored_total{event_type="finalized", success="true"}[1h]))
              /
              sum(rate(raia_events_stored_total{event_type="finalized"}[1h]))
            )
          ) > (0.001 * 14.4)  # 14.4x burn rate
        labels:
          severity: critical
          team: reliability
          slo: "success_rate"
        annotations:
          summary: "Fast burn of success rate SLO"
          description: "Error budget burning 14.4x faster than sustainable rate"

      # Slow burn: consuming 10% of monthly budget in 6 hours
      - alert: SuccessRateSLOSlowBurn
        expr: |
          (
            1 - (
              sum(rate(raia_events_stored_total{event_type="finalized", success="true"}[6h]))
              /
              sum(rate(raia_events_stored_total{event_type="finalized"}[6h]))
            )
          ) > (0.001 * 2)  # 2x burn rate
        for: 30m
        labels:
          severity: warning
          team: reliability
          slo: "success_rate"
        annotations:
          summary: "Slow burn of success rate SLO"
          description: "Error budget burning 2x faster than sustainable rate"
